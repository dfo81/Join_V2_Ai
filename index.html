<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Join App</title>
  <link rel="shortcut icon" href="./assets/icons/login/logo_blue.svg" type="image/x-icon" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./style/welcome.css" />
</head>

<body>
  <div class="welcome-page">
    <!-- logo box postion absolute -->
    <div class="welcome-logo-wrapper">
      <img class="welcome-logo" src="./assets/icons/login/logo_white.svg" alt="Join Logo" />
    </div>

    <div class="welcome-wrapper">
      <!-- top section -->
      <header class="welcome-header">
        <div class="welcome-logo-space"></div>
        <div class="welcome-sign-up">
          Not a Join user?
          <a href="./login.html#signup">Sign up</a>
        </div>
      </header>

      <!-- main section -->
      <main class="welcome-main">
        <section class="welcome-card">
          <div class="welcome-title-box">
            <h1 class="welcome-title">Welcome</h1>
            <div class="welcome-title-border"></div>
          </div>

          <p class="welcome-text">
            Pick the option that suits your role: create a request as a stakeholder or log in if you're part of the
            team.
          </p>

          <div class="welcome-options">
            <!-- stakeholder -->
            <div class="welcome-option">
              <div class="welcome-option-label">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M4 21q-.825 0-1.412-.587T2 19V8q0-.825.588-1.412T4 6h4V4q0-.825.588-1.412T10 2h4q.825 0 1.413.588T16 4v2h4q.825 0 1.413.588T22 8v11q0 .825-.587 1.413T20 21zm0-2h16V8H4zm6-13h4V4h-4z" />
                </svg>
                Are you a stakeholder?
              </div>
              <a href="./stakeholder.html" class="base-button button-small welcome-button-blue">Create request</a>
            </div>

            <!-- team member -->
            <div class="welcome-option">
              <div class="welcome-option-label">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M1 20v-2.8q0-.85.438-1.562T2.6 14.55q1.55-.775 3.15-1.162T9 13t3.25.388t3.15 1.162q.725.375 1.163 1.088T17 17.2V20zm18 0v-3q0-1.1-.612-2.113T16.65 13.15q1.275.15 2.4.513t2.1.887q.9.5 1.375 1.112T23 17v3zM9 12q-1.65 0-2.825-1.175T5 8t1.175-2.825T9 4t2.825 1.175T13 8t-1.175 2.825T9 12m10-4q0 1.65-1.175 2.825T15 12q-.275 0-.7-.062t-.7-.138q.675-.8 1.038-1.775T15 8t-.362-2.025T13.6 4.2q.35-.125.7-.162T15 4q1.65 0 2.825 1.175T19 8M3 18h12v-.8q0-.275-.137-.5t-.363-.35q-1.35-.675-2.725-1.012T9 15t-2.775.338T3.5 16.35q-.225.125-.363.35T3 17.2zm6-8q.825 0 1.413-.587T11 8t-.587-1.412T9 6t-1.412.588T7 8t.588 1.413T9 10m0 8" />
                </svg>
                Are you a team member?
              </div>
              <a href="./login.html" class="base-button button-small welcome-button-hollow">Member log in</a>
            </div>
          </div>
        </section>
      </main>

      <!-- bottom section -->
      <footer class="welcome-footer">
        <a href="./privacy-policy.html">Privacy Policy</a>
        <a href="./legal-notice.html">Legal Notice</a>
      </footer>
    </div>
  </div>
</body>

</html>
